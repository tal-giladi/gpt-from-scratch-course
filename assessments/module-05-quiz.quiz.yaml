  question: "`evaluate_bpb` sums nats and bytes over all batches, then divides once. Batch A is 1,000 nats over 1,000 bytes; batch B is 100 nats over 10 bytes. What do summing and per-batch averaging give?"
  options:
    - Summed ≈ 1.57 bpb; averaged ≈ 7.9 bpb, because the tiny batch dominates
    - Summed ≈ 7.9 bpb; averaged ≈ 1.57 bpb, because the large batch dominates
    - Both give ≈ 1.57 bpb, since the two methods are equivalent here
    - Summed ≈ 1.09 bpb; averaged ≈ 5.5 bpb, because nats are not converted
  correct: 0
