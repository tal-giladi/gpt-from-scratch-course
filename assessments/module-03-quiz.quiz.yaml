- source: fe5c55d53c34
  question: Why is `logits.float()` there, when on CPU the model already runs in float32?
  options:
    - It fixes a CPU bug where float32 logits overflow in the softmax
    - It keeps the loss in fp32 when the same code runs under bf16 autocast on a GPU
    - It converts integer token ids to floats before the loss is computed
    - "`torch.compile` requires it, because it cannot trace mixed dtypes"
  correct: 1
- source: be6b519379ee
  question: "`softcap = 15`. A colleague raises it to 1000 'since it barely does anything.' What is the largest probability ratio before and after, and is the change safe?"
  options:
    - About `e^15` before, `e^1000` after; safe, since the cap is only a numerical guard
    - About `e^30` before and the same after; safe, since logits never exceed 15
    - About `e^30` before, practically unbounded after; not clearly safe, as the cap also steadies training
    - About `e^15` before, `e^2000` after; unsafe, since it always causes NaNs
  correct: 2
