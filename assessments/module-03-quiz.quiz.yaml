- source: bedf327ac0c6
  question: At `n_embd = 128`, `n_layer = 2` about 89% of parameters are embedding tables; at `n_embd = 1024`, `n_layer = 24` that share collapses. Why?
  options:
    - Embeddings grow with width squared, while block matrices grow linearly
    - Embeddings shrink with depth, because every layer shares the same table
    - Embeddings grow linearly with width; block matrices grow with width squared and with depth
    - Both grow linearly, but block matrices receive a larger learning rate
  correct: 2
- source: ede919a926f9
  question: A colleague removes the two `zeros_` calls in `init_weights`, so `c_proj` starts random like every other matrix. What changes, and why is it worse at 32 layers than at 2?
  options:
    - Blocks add random noise at step 0, and over 32 layers it compounds into exploding or vanishing signals
    - The model starts closer to a good solution, so depth makes no real difference
    - "`c_proj` can no longer be updated, and deeper models have more of these matrices"
    - Only the first logged loss changes, which matters more for shallow models than deep ones
  correct: 0
