  options:
    - Greedy is stuck in a fixed point; temperature adds variety, top-k cuts off the rare tail
    - The model is overfit; dropout and weight decay fix it at some cost in accuracy
    - The softcap is too low; raising it and lowering the learning rate fix it
    - The tokenizer merged 'the'; a larger vocabulary and more BOS tokens fix it
