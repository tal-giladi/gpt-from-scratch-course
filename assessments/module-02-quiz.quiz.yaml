- source: 377d4df1e847
  question: In `manual_attention` you mask with `float("-inf")`. A colleague suggests `-1e9` 'to avoid NaNs.' Which statement is right?
  options:
    - "`-1e9` always differs, because `exp(-1e9)` is not zero in float32"
    - "`-inf` gives a NaN whenever any single entry in a row is masked"
    - They agree in practice; `-inf` gives NaN only for a fully masked row, impossible under a causal mask
    - They agree in float16 but differ in float32; `-inf` gives a NaN at position 0
  correct: 2
- source: 824689018f1d
  question: Rotary embeddings are applied to `q` and `k` but not to `v`. Why, and what would rotating `v` break?
  options:
    - Rotating `v` would double the attention FLOPs for no gain in quality
    - "`v` has a different head dimension, so the rotation would not fit"
    - Position belongs to what you carry back; rotating `q` and `k` is already redundant
    - Position belongs to where you look; a rotated `v` returns content altered by where it was found
  correct: 3
- source: 042ef93166ee
  question: RMS norm here has no learned gain. Why does a gain in front of a bias-free linear layer add no expressive power, and does that argument cover `norm(q)` and `norm(k)`?
  options:
    - The RMS normalisation cancels the gain; yes, the same holds for QK norm
    - The linear layer absorbs it by rescaling its columns; no, QK norm has no free matrix downstream
    - The gain starts at 1 and never learns; yes, for the same reason
    - The next layer's weight decay removes it; no, because QK norm has no weight decay
  correct: 1
