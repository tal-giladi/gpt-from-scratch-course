- source: a961125717ff
  question: A colleague says 'layer 5 transforms the output of layer 4.' Which correction is right, including what `x0_lambdas` adds?
  options:
    - Layer 5 replaces the stream; `x0_lambdas` scales each layer's learning rate
    - Layer 5 reads only layer 4's contribution; `x0_lambdas` skips layers in training
    - Layer 5 adds to the stream; `x0_lambdas` removes the raw embedding from deep layers
    - Layer 5 adds to the stream; `x0_lambdas` mixes the original embedding back in at each layer
  correct: 3
- source: 2790b513e2a4
  question: You delete the line that applies rotary embeddings to `q` and `k` and retrain. The loss still falls. What happens?
  options:
    - Training diverges at once, because the attention scores become unbounded
    - Attention becomes order-blind, and the loss plateaus at a visibly worse `val_bpb`
    - Nothing changes, because the causal mask already encodes position
    - Position is learned from the value embeddings instead, with the same `val_bpb`
  correct: 1
