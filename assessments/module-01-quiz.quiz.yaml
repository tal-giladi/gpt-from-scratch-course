- source: 4eeef8d1e10d
  question: A colleague raises `VOCAB_SIZE` from 8,192 to 32,768 'so the model understands more words.' What gets more expensive, and what number improves without the model being any better?
  options:
    - "`wte` shrinks while `lm_head` grows; `val_bpb` falls because tokens get shorter"
    - Only tokenizer training gets slower; `val_bpb` falls because more words are known
    - "`lm_head` and the embedding tables grow; loss per token falls because each token covers more bytes"
    - Attention cost grows with the vocabulary; loss per byte falls because sequences get longer
  correct: 2
- source: fcea5663bcd9
  question: A row has capacity `T + 1 = 257` and the buffer holds documents of length `[300, 180, 90, 40, 12]`. How does the packer build one row?
  options:
    - 180, 40, 12, then the first 25 tokens of the 90; the 300 stays in the buffer
    - 180, 40, 12, then the first 25 tokens of the 300, the longest remaining
    - 180, 90, then the first 12 tokens of the 40; the 12 waits for the next row
    - The first 257 tokens of the 300; the rest carries over to the next row
  correct: 0
- source: e9f467024688
  question: Why does `prepare.py` prepend BOS to every *document* rather than to every *row*?
  options:
    - BOS per row would make rows unequal in length and break the `(B, T)` rectangle
    - BOS per document uses fewer tokens overall than BOS per row
    - The tokenizer can insert BOS only at document starts, never at row starts
    - A row holds several documents, and per-row BOS would hide every internal boundary
  correct: 3
