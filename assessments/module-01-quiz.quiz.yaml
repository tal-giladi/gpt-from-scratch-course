  question: Model A (8k vocabulary) reports a final loss of 3.1 nats/token; model B (64k vocabulary) reports 3.4 nats/token on the same text. Which is better?
  options:
    - Model A, because 3.1 is lower than 3.4 nats per token
    - You can't tell; convert both to bits per byte using each model's bytes per token
    - Model B, because a larger vocabulary always gives the better model
    - You can't tell; compare both at the same number of training steps instead
