- source: 0fec6d3de532
  question: After the first `backward()` of a fresh model, `mlp.c_fc.weight.grad.abs().max()` prints `0.0`. Is this a bug?
  options:
    - "Yes: `c_fc` was initialised to zero by mistake"
    - "No, at any step: `c_fc` never receives gradient by design"
    - "Yes: `zero_grad` ran after `backward()` instead of before it"
    - Not at step 0, because `c_proj` is zero; a bug only if it stays zero after step 1
  correct: 3
- source: a8311c12dca6
  question: Someone removes `model.zero_grad(set_to_none=True)` from the training loop and the run does not crash. What happens to the effective step size over the first ten steps?
  options:
    - It stays the same, because Adam normalises every gradient
    - It grows roughly with the step number, as each update sums all past gradients
    - It shrinks, because stale gradients cancel the new ones
    - It resets every step, because `backward()` overwrites `.grad`
  correct: 1
- source: 90296080d1b2
  question: Why does AdamW divide by `sqrt(exp_avg_sq)`, and why is weight decay applied as `p.mul_(1 - lr*wd)` instead of adding `wd*p` to the gradient?
  options:
    - Dividing lowers the learning rate over time; decoupling makes the decay act faster
    - Dividing keeps the gradient's sign; decoupling lets the decay follow the gradient
    - Dividing makes each coordinate's step scale-invariant; decoupling keeps decay out of that normalisation
    - Dividing prevents NaNs; decoupling saves one multiply per parameter
  correct: 2
- source: 369ecde39627
  question: Muon orthogonalises the update with five Newton-Schulz iterations instead of an SVD. What is the performance reason, and the caveat?
  options:
    - Just matmuls, fast on GPUs; but singular values only get close to 1, and input must be normalised
    - It is exact, unlike SVD; but it needs double precision to converge
    - It uses less memory than SVD; but it works only for square matrices
    - It runs on the CPU while the GPU trains; but it sets the matrix entries to 1
  correct: 0
